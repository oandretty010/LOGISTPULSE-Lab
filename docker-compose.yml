# Stack completo del laboratorio LOGISTPULSE.
#   docker compose up -d --build          -> todo
#   docker compose up -d carrier-mock     -> solo el transportista simulado (modo lite híbrido)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: logistpulse
      POSTGRES_USER: logistpulse
      POSTGRES_PASSWORD: logistpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistpulse -d logistpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "15672:15672"     # consola web: guest / guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  carrier-mock:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./infra/wiremock:/home/wiremock
    ports:
      - "9091:8080"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      carrier-mock:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq
      CARRIER_URL: http://carrier-mock:8080
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata: {}
